<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DAPI — сайты, приложения, безопасность, продакшн</title>
<meta name="description" content="DAPI — сайты, приложения, безопасность и креативный продакшн на основе ИИ.">
<link rel="icon" href="assets/images/logo-mark.svg" type="image/svg+xml">
<link rel="preload" as="image" href="assets/images/hero-sites.jpg">
<link rel="stylesheet" href="assets/css/style.css">
<script>document.documentElement.classList.add("js-anim-ready");</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400;0,500;0,600;0,700;1,500&display=swap" rel="stylesheet">
</head>
<body>

<header class="topbar">
  <div class="wrap topbar-inner">
    <button class="menu-btn" id="menuBtn" type="button" aria-expanded="false" aria-controls="drawer">
      <span class="menu-btn-icon" aria-hidden="true"><span></span><span></span><span></span></span>
      <span class="menu-btn-label">Меню</span>
    </button>

    <a class="brand" href="index.html">
      <span class="brand-word">DAPI</span>
    </a>

    <span class="topbar-spacer" aria-hidden="true"></span>
  </div>
</header>

<div class="drawer-backdrop" id="drawerBackdrop" hidden></div>
<nav class="drawer" id="drawer" aria-hidden="true">
  <button class="drawer-close" id="drawerClose" type="button" aria-label="Закрыть меню">×</button>
  <p class="drawer-note">Меню в разработке</p>
</nav>

<section class="hero">
  <div class="hero-media">
    <img class="hero-img is-active" id="heroImgDefault" src="assets/images/hero-default.jpg" alt="DAPI — горная эмблема команды среди облаков">
    <img class="hero-img" id="heroImgAlt" src="assets/images/hero-sites.jpg" alt="" aria-hidden="true">
    <div class="hero-top-fade" aria-hidden="true"></div>
    <div class="mist-band mist-band-1" aria-hidden="true"></div>
    <div class="mist-band mist-band-2" aria-hidden="true"></div>
    <div class="mist-band mist-band-3" aria-hidden="true"></div>
    <div class="hero-scrim" id="heroScrim" aria-hidden="true"></div>
    <div class="hero-badge" id="heroBadge" hidden><span>Скоро</span></div>
  </div>

  <div class="hero-tiles-wrap">
    <div class="wrap">
      <div class="hero-tiles" role="group" aria-label="Направления">
        <button class="tile" type="button" data-tint="sky" data-image="assets/images/hero-sites.jpg" data-alt="Разработчик за ноутбуком на скале среди гор — интерфейс сайта и код на фоне">
          <span class="tile-index">01</span>
          <span class="tile-title">Создание сайтов</span>
          <span class="tile-desc">Сайты, которые продают — от лендинга до сложного продукта.</span>
        </button>
        <button class="tile" type="button" data-tint="sand">
          <span class="tile-index">02</span>
          <span class="tile-title">Создание приложений</span>
          <span class="tile-desc">Мобильные и веб-приложения — от идеи до релиза в сторах.</span>
        </button>
        <button class="tile" type="button" data-tint="pine">
          <span class="tile-index">03</span>
          <span class="tile-title">Безопасность</span>
          <span class="tile-desc">Защита данных сайтов и приложений: находим и устраняем уязвимости.</span>
        </button>
        <button class="tile" type="button" data-tint="stone">
          <span class="tile-index">04</span>
          <span class="tile-title">Продакшн</span>
          <span class="tile-desc">Креативы на основе ИИ: реклама, ролики, анимация, дизайн.</span>
        </button>
      </div>
    </div>
  </div>
</section>

<script src="assets/js/main.js"></script>
</body>
</html>
